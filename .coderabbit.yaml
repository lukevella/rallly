# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
reviews:
  path_instructions:
    - path: "apps/web/public/locales/en/**"
      instructions: >
        These files are generated by `pnpm i18n:scan` from `Trans` and `t()`
        calls in source. A new or changed English entry is the expected
        companion to a source change and is not a manual translation edit.
        Only flag a key that is not camelCase, that has no matching usage in
        the diff or the codebase, or a value with unbalanced ICU braces.
    - path: "apps/landing/public/locales/en/**"
      instructions: >
        These files are generated by `pnpm i18n:scan` from `Trans` and `t()`
        calls in source. A new or changed English entry is the expected
        companion to a source change and is not a manual translation edit.
        Only flag a key that is not camelCase, that has no matching usage in
        the diff or the codebase, or a value with unbalanced ICU braces.
    - path: "packages/emails/locales/en/**"
      instructions: >
        These files are generated by `pnpm i18n:scan` from `Trans` and `t()`
        calls in source. A new or changed English entry is the expected
        companion to a source change and is not a manual translation edit.
        Only flag a key that is not camelCase, that has no matching usage in
        the diff or the codebase, or a value with unbalanced ICU braces.
    - path: "apps/web/public/locales/!(en)/**"
      instructions: >
        Non-English locale files are written by the Translate workflow. Flag any
        change to them unless the pull request is titled "🌐 Update translations"
        or its stated purpose is correcting a translation.
    - path: "apps/landing/public/locales/!(en)/**"
      instructions: >
        Non-English locale files are written by the Translate workflow. Flag any
        change to them unless the pull request is titled "🌐 Update translations"
        or its stated purpose is correcting a translation.
    - path: "packages/emails/locales/!(en)/**"
      instructions: >
        Non-English locale files are written by the Translate workflow. Flag any
        change to them unless the pull request is titled "🌐 Update translations"
        or its stated purpose is correcting a translation.
