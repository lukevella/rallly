name: preprod

# Un push sur preprod (merge d'une PR de feature compris) construit l'image
# Rallly du fork, la teste, la publie sur GHCR puis la déploie sur la VM par son
# runner auto-hébergé. Pas de déclencheur pull_request : le dépôt est public,
# un job de PR externe exécuterait du code sur la VM.
on:
  push:
    branches: [preprod]
  workflow_dispatch:

concurrency:
  group: preprod
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      packages: write
      security-events: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=ref,event=branch

      # Build local d'abord : on teste avant de publier quoi que ce soit
      - name: Build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            SELF_HOSTED=true
            APP_VERSION=${{ github.sha }}
          load: true
          tags: rallly:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Test de démarrage (image + Postgres)
        run: |
          docker network create ci
          docker run -d --name db --network ci \
            -e POSTGRES_PASSWORD=postgres -e POSTGRES_DB=rallly postgres:16-alpine
          for i in $(seq 1 30); do
            docker exec db pg_isready -U postgres && break; sleep 2
          done
          docker run -d --name app --network ci -p 3000:3000 \
            -e DATABASE_URL=postgres://postgres:postgres@db/rallly \
            -e SECRET_PASSWORD=0123456789abcdef0123456789abcdef \
            -e SUPPORT_EMAIL=support@example.com \
            -e NEXT_PUBLIC_BASE_URL=http://localhost:3000 \
            rallly:ci
          for i in $(seq 1 40); do
            if curl -fsS --max-time 5 http://localhost:3000/api/status | jq -e '.database == "connected"'; then
              curl -fsSL --max-time 15 -o /dev/null http://localhost:3000/login
              echo "application démarrée, base connectée, page de login servie"; exit 0
            fi
            sleep 3
          done
          docker logs app
          exit 1

      # Rapport complet, sans faire échouer : alimente l'onglet Security
      - name: Trivy image (rapport SARIF)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rallly:ci
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          format: sarif
          output: trivy-image.sarif
          exit-code: "0"

      - uses: github/codeql-action/upload-sarif@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        if: always()
        with:
          sarif_file: trivy-image.sarif
          category: trivy-image

      # Barrière avant publication : une faille critique corrigeable bloque le push et le déploiement
      - name: Trivy image (barrière)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: rallly:ci
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Login GHCR
        uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Même cache que le build local : l'image publiée est celle qui a été testée
      - name: Push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: apps/web/Dockerfile
          build-args: |
            SELF_HOSTED=true
            APP_VERSION=${{ github.sha }}
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha

  deploy:
    needs: build
    runs-on: [self-hosted, preprod]
    timeout-minutes: 15
    permissions:
      contents: read
      packages: read
    env:
      # Dossier de la stack sur la VM : y vivent .env, users_database.yml et oidc_key.pem
      STACK_DIR: /home/ogb4n/stack
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          sparse-checkout: docker/preprod

      # Les secrets (.env, users_database.yml, oidc_key.pem) vivent sur la VM, jamais dans le dépôt :
      # la copie ne les écrase pas puisqu'ils n'existent pas dans docker/preprod.
      - name: Copier la configuration
        run: cp -a docker/preprod/. "$STACK_DIR"/

      # Connexion avec le jeton du job : marche que le paquet soit public ou privé,
      # et la session est supprimée en fin de job.
      - name: Login GHCR
        run: echo "$GITHUB_TOKEN" | docker login "$REGISTRY" -u "$GITHUB_ACTOR" --password-stdin
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # L'image est épinglée sur le commit déployé : retour arrière = rejouer un ancien commit
      - name: Démarrer la stack
        working-directory: ${{ env.STACK_DIR }}
        run: |
          export RALLLY_IMAGE="${REGISTRY}/${IMAGE_NAME}:sha-${GITHUB_SHA::7}"
          docker compose --profile tunnel pull --quiet
          docker compose --profile tunnel up -d --remove-orphans --wait --wait-timeout 180

      - name: Vérifier la découverte OIDC
        working-directory: ${{ env.STACK_DIR }}
        run: |
          domain=$(grep '^DOMAIN=' .env | cut -d= -f2)
          curl -fsSk -H "Host: auth.${domain}" https://127.0.0.1/.well-known/openid-configuration >/dev/null

      - name: Logout GHCR
        if: always()
        run: docker logout "$REGISTRY"
