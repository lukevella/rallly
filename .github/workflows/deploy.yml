name: CD - Deploy

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

jobs:
  test-runner:
    name: Test GHCR access
    runs-on: [self-hosted, Linux, X64]

    steps:
      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull Rallly image
        run: docker pull ghcr.io/rally-ynov/fork-rallly-m2-devfullstack:main

      - name: Logout from GHCR
        if: always()
        run: docker logout ghcr.io