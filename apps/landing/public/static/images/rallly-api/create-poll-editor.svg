<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- An editor in the app's dark palette (zinc surfaces, indigo primary)
       showing the create poll request from the post. The hero accent gradient
       marks the active tab and the API URL. Indentation is positioned by x
       offset: viewers disagree on whitespace inside SVG text. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#615fff"/>
      <stop offset="1" stop-color="#8e51ff"/>
    </linearGradient>
    <clipPath id="window"><rect x="24" y="24" width="752" height="402" rx="12"/></clipPath>
  </defs>
  <rect width="800" height="450" fill="#18181b"/>
  <g clip-path="url(#window)">
    <rect x="24" y="24" width="752" height="402" fill="#1f1f22"/>
    <rect x="24" y="24" width="168" height="402" fill="#1b1b1e"/>
    <line x1="192.5" y1="24" x2="192.5" y2="426" stroke="#3f3f46"/>
    <rect x="24" y="24" width="752" height="38" fill="#1b1b1e"/>
    <line x1="24" y1="62.5" x2="776" y2="62.5" stroke="#3f3f46"/>
    <circle cx="46" cy="43" r="5.5" fill="#3f3f46"/>
    <circle cx="64" cy="43" r="5.5" fill="#3f3f46"/>
    <circle cx="82" cy="43" r="5.5" fill="#3f3f46"/>
    <rect x="193" y="24" width="150" height="38" fill="#1f1f22"/>
    <rect x="193" y="60" width="150" height="2.5" fill="url(#accent)"/>
    <text x="212" y="47" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#e4e4e7">create-poll.ts</text>
    <text x="362" y="47" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12.5" fill="#71717a">results.ts</text>
    <text x="44" y="88" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="11" font-weight="600" letter-spacing="0.6" fill="#71717a">EXPLORER</text>
    <path d="M44 104 l4 4 -4 4" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="54" y="112" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a1a1aa">rallly-integration</text>
    <path d="M58 128 l4 4 -4 4" fill="none" stroke="#71717a" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
    <text x="68" y="136" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a1a1aa">src</text>
    <rect x="32" y="145" width="152" height="22" rx="5" fill="#27272a"/>
    <rect x="72" y="151" width="8" height="10" rx="2" fill="none" stroke="#52525b"/>
    <text x="86" y="160" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#e4e4e7">create-poll.ts</text>
    <rect x="72" y="175" width="8" height="10" rx="2" fill="none" stroke="#52525b"/>
    <text x="86" y="184" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a1a1aa">results.ts</text>
    <rect x="58" y="199" width="8" height="10" rx="2" fill="none" stroke="#52525b"/>
    <text x="72" y="208" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a1a1aa">.env</text>
    <rect x="58" y="223" width="8" height="10" rx="2" fill="none" stroke="#52525b"/>
    <text x="72" y="232" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="12" fill="#a1a1aa">package.json</text>
    <g font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12.5">
      <text x="220" y="84" text-anchor="end" fill="#52525b">1</text>
      <text x="236" y="84"><tspan fill="#c4b5fd">const </tspan><tspan fill="#d4d4d8">res</tspan><tspan fill="#71717a"> = </tspan><tspan fill="#c4b5fd">await </tspan><tspan fill="#d4d4d8">fetch</tspan><tspan fill="#71717a">(</tspan><tspan fill="url(#accent)">"https://api.rallly.co/v1/polls"</tspan><tspan fill="#71717a">, {</tspan></text>
      <text x="220" y="102" text-anchor="end" fill="#52525b">2</text>
      <text x="251" y="102"><tspan fill="#e4e4e7">method</tspan><tspan fill="#71717a">: </tspan><tspan fill="#a5b4fc">"POST"</tspan><tspan fill="#71717a">,</tspan></text>
      <text x="220" y="120" text-anchor="end" fill="#52525b">3</text>
      <text x="251" y="120"><tspan fill="#e4e4e7">headers</tspan><tspan fill="#71717a">: {</tspan></text>
      <text x="220" y="138" text-anchor="end" fill="#52525b">4</text>
      <text x="266" y="138"><tspan fill="#e4e4e7">Authorization</tspan><tspan fill="#71717a">: </tspan><tspan fill="#a5b4fc">`Bearer </tspan><tspan fill="#a1a1aa">${</tspan><tspan fill="#d4d4d8">process</tspan><tspan fill="#71717a">.</tspan><tspan fill="#d4d4d8">env</tspan><tspan fill="#71717a">.</tspan><tspan fill="#d4d4d8">RALLLY_API_KEY</tspan><tspan fill="#a1a1aa">}</tspan><tspan fill="#a5b4fc">`</tspan><tspan fill="#71717a">,</tspan></text>
      <text x="220" y="156" text-anchor="end" fill="#52525b">5</text>
      <text x="266" y="156"><tspan fill="#a5b4fc">"Content-Type"</tspan><tspan fill="#71717a">: </tspan><tspan fill="#a5b4fc">"application/json"</tspan><tspan fill="#71717a">,</tspan></text>
      <text x="220" y="174" text-anchor="end" fill="#52525b">6</text>
      <text x="251" y="174"><tspan fill="#71717a">},</tspan></text>
      <text x="220" y="192" text-anchor="end" fill="#52525b">7</text>
      <text x="251" y="192"><tspan fill="#e4e4e7">body</tspan><tspan fill="#71717a">: </tspan><tspan fill="#d4d4d8">JSON</tspan><tspan fill="#71717a">.</tspan><tspan fill="#d4d4d8">stringify</tspan><tspan fill="#71717a">({</tspan></text>
      <text x="220" y="210" text-anchor="end" fill="#52525b">8</text>
      <text x="266" y="210"><tspan fill="#e4e4e7">title</tspan><tspan fill="#71717a">: </tspan><tspan fill="#a5b4fc">"Team offsite"</tspan><tspan fill="#71717a">,</tspan></text>
      <text x="220" y="228" text-anchor="end" fill="#52525b">9</text>
      <text x="266" y="228"><tspan fill="#e4e4e7">kind</tspan><tspan fill="#71717a">: </tspan><tspan fill="#a5b4fc">"date"</tspan><tspan fill="#71717a">,</tspan></text>
      <text x="220" y="246" text-anchor="end" fill="#52525b">10</text>
      <text x="266" y="246"><tspan fill="#e4e4e7">options</tspan><tspan fill="#71717a">: [</tspan></text>
      <text x="220" y="264" text-anchor="end" fill="#52525b">11</text>
      <text x="281" y="264"><tspan fill="#71717a">{ </tspan><tspan fill="#e4e4e7">date</tspan><tspan fill="#71717a">: </tspan><tspan fill="#a5b4fc">"2026-10-05"</tspan><tspan fill="#71717a"> },</tspan></text>
      <text x="220" y="282" text-anchor="end" fill="#52525b">12</text>
      <text x="281" y="282"><tspan fill="#71717a">{ </tspan><tspan fill="#e4e4e7">date</tspan><tspan fill="#71717a">: </tspan><tspan fill="#a5b4fc">"2026-10-06"</tspan><tspan fill="#71717a"> },</tspan></text>
      <text x="220" y="300" text-anchor="end" fill="#52525b">13</text>
      <text x="281" y="300"><tspan fill="#71717a">{ </tspan><tspan fill="#e4e4e7">date</tspan><tspan fill="#71717a">: </tspan><tspan fill="#a5b4fc">"2026-10-07"</tspan><tspan fill="#71717a"> },</tspan></text>
      <text x="220" y="318" text-anchor="end" fill="#52525b">14</text>
      <text x="266" y="318"><tspan fill="#71717a">],</tspan></text>
      <text x="220" y="336" text-anchor="end" fill="#52525b">15</text>
      <text x="251" y="336"><tspan fill="#71717a">}),</tspan></text>
      <text x="220" y="354" text-anchor="end" fill="#52525b">16</text>
      <text x="236" y="354"><tspan fill="#71717a">});</tspan></text>
      <text x="220" y="372" text-anchor="end" fill="#52525b">17</text>
      <text x="220" y="390" text-anchor="end" fill="#52525b">18</text>
      <text x="236" y="390"><tspan fill="#c4b5fd">const </tspan><tspan fill="#71717a">{ </tspan><tspan fill="#d4d4d8">data</tspan><tspan fill="#71717a"> } = </tspan><tspan fill="#c4b5fd">await </tspan><tspan fill="#d4d4d8">res</tspan><tspan fill="#71717a">.</tspan><tspan fill="#d4d4d8">json</tspan><tspan fill="#71717a">();</tspan></text>
      <text x="220" y="408" text-anchor="end" fill="#52525b">19</text>
      <text x="236" y="408"><tspan fill="#d4d4d8">console</tspan><tspan fill="#71717a">.</tspan><tspan fill="#d4d4d8">log</tspan><tspan fill="#71717a">(</tspan><tspan fill="#d4d4d8">data</tspan><tspan fill="#71717a">.</tspan><tspan fill="#e4e4e7">inviteUrl</tspan><tspan fill="#71717a">);</tspan></text>
    </g>
  </g>
  <rect x="24.5" y="24.5" width="751" height="401" rx="12" fill="none" stroke="#3f3f46"/>
</svg>
