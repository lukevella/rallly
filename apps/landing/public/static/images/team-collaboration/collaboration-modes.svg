<svg xmlns="http://www.w3.org/2000/svg" width="800" height="450" viewBox="0 0 800 450">
  <!-- Textless wireframe in the how-it-works style: bars stand in for copy so
       the illustration doesn't compete with the post. Left screen is a space
       with collaboration off (each member keeps to their own polls), right
       screen is the same space with collaboration on (one shared pool). The
       hero accent gradient marks the switched-on toggle. -->
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#615fff"/>
      <stop offset="1" stop-color="#8e51ff"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="#f4f4f5"/>

  <!-- Collaboration off: members work independently -->
  <rect x="44.5" y="45.5" width="343" height="359" rx="12" fill="#ffffff" stroke="#e4e4e7"/>
  <rect x="64" y="65" width="34" height="18" rx="9" fill="#e4e4e7"/>
  <circle cx="73" cy="74" r="7" fill="#ffffff"/>
  <rect x="106" y="70" width="64" height="8" rx="4" fill="#d4d4d8"/>
  <line x1="64" y1="97.5" x2="368" y2="97.5" stroke="#e4e4e7" stroke-opacity="0.6"/>

  <g>
    <rect x="64.5" y="111.5" width="303" height="80" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
    <circle cx="90" cy="151" r="10" fill="#d4d4d8"/>
