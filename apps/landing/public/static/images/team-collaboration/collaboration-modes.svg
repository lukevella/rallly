    <rect x="600" y="194" width="44" height="6" rx="3" fill="#e4e4e7"/>
    <circle cx="606" cy="243" r="6" fill="#d4d4d8"/>
    <rect x="618" y="240" width="32" height="6" rx="3" fill="#e4e4e7"/>
  </g>
  <g>
    <rect x="444.5" y="275.5" width="133" height="97" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="454" y="289" width="64" height="6" rx="3" fill="#d4d4d8"/>
    <rect x="454" y="303" width="44" height="6" rx="3" fill="#e4e4e7"/>
    <circle cx="460" cy="352" r="6" fill="#d4d4d8"/>
    <rect x="472" y="349" width="32" height="6" rx="3" fill="#e4e4e7"/>
  </g>
  <g>
    <rect x="590.5" y="275.5" width="133" height="97" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="600" y="289" width="64" height="6" rx="3" fill="#d4d4d8"/>
