    <rect x="250" y="155" width="36" height="6" rx="3" fill="#e4e4e7"/>
  </g>
  <g>
    <rect x="64.5" y="201.5" width="303" height="80" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
    <circle cx="90" cy="241" r="10" fill="#d4d4d8"/>
    <rect x="114.5" y="219.5" width="114" height="44" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="124" y="231" width="56" height="6" rx="3" fill="#d4d4d8"/>
    <rect x="124" y="245" width="36" height="6" rx="3" fill="#e4e4e7"/>
    <rect x="240.5" y="219.5" width="114" height="44" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="250" y="231" width="56" height="6" rx="3" fill="#d4d4d8"/>
    <rect x="250" y="245" width="36" height="6" rx="3" fill="#e4e4e7"/>
  </g>
  <g>
    <rect x="64.5" y="291.5" width="303" height="80" rx="8" fill="#fafafa" stroke="#e4e4e7"/>
    <circle cx="90" cy="331" r="10" fill="#d4d4d8"/>
    <rect x="114.5" y="309.5" width="114" height="44" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
    <rect x="124" y="321" width="56" height="6" rx="3" fill="#d4d4d8"/>
    <rect x="124" y="335" width="36" height="6" rx="3" fill="#e4e4e7"/>
    <rect x="240.5" y="309.5" width="114" height="44" rx="6" fill="#ffffff" stroke="#e4e4e7"/>
