# Modified in this fork: the database user, password, name and ports are read
# from the root .env file (see .env.sample) instead of being written here.
services:
  rallly_db:
    image: postgres:18-alpine
    restart: always
    ports:
      - "${POSTGRES_PORT:-5450}:5432"
    volumes:
      - db-data:/var/lib/postgresql
    environment:
      - POSTGRES_USER=${POSTGRES_USER:-postgres}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env (see .env.sample)}
      - POSTGRES_DB=${POSTGRES_DB:-rallly}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 5s
      retries: 5

  rallly_selfhosted:
    build:
      args:
        - SELF_HOSTED=true
      context: .
      dockerfile: ./apps/web/Dockerfile
    restart: always
    depends_on:
      rallly_db:
        condition: service_healthy
    ports:
      - ${APP_PORT:-7201}:3000
    environment:
      - DATABASE_URL=postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD}@rallly_db/${POSTGRES_DB:-rallly}
    env_file:
      - path: apps/web/.env
        required: false

volumes:
  db-data:
    driver: local
